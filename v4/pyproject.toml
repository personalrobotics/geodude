# Geodude 4.0: Geodude on ssrobot and ssgrasping (personalrobotics/geodude#213).
#
# It is built alongside the legacy 3.x app at the repository root, as its own uv project
# with its own environment, and replaces it at the cutover (#212). It never imports
# mj_manipulator, mj_environment, asset_manager, or the old mj-viser
# (scripts/check_boundary.py).
[project]
name = "geodude"
version = "4.0.0.dev0"
description = "Geodude, the bimanual robot, on ssrobot and ssgrasping"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ssmjviser==1.0.0",
    # Imported directly (regions.py): the Robotiq hands' closed reach and a box's scaled
    # default margin (sstsr#193, #195).
    "sstsr==4.1.0",
    # Pinned by commit: the contracts and skills this app is proven against.
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@6445900f339f4d5a82566e3647c1b42396dbe1a2",
    "ssgrasping @ git+https://github.com/personalrobotics/ssgrasping@8d8cd078eb75e59f5c54cde27b5a861317cb8903",
    "prl-assets @ git+https://github.com/personalrobotics/prl_assets@9e2f8feb32b95e5eda65f236579ed1ff8292804f",
    # The 2F-140 driven like the real gripper (geodude_assets#38), with its declared
    # completion detector (#40), and each pad's torsional friction its contact face's
    # (#41). One commit past ssrobot's reference pin for Geodude (references/robots.toml).
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@d139e8c06e9d9a2f2c3bce30bd867e7e937c1ad4",
]

[project.scripts]
geodude-recycling = "geodude.recycling:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/geodude"]

# Its own workspace root: uv never adopts it into the robot-code workspace around the
# legacy app.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "prl_assets.*", "geodude_assets.*", "mj_viser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
