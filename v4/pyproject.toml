# Geodude 4.0: Geodude on ssrobot and ssgrasping (personalrobotics/geodude#213).
#
# It is built alongside the legacy 3.x app at the repository root, as its own uv project
# with its own environment, and replaces it at the cutover (#212). It never imports
# mj_manipulator, mj_environment, asset_manager, or the old mj-viser
# (scripts/check_boundary.py).
[project]
name = "geodude"
version = "4.0.0.dev0"
description = "Geodude, the bimanual robot, on ssrobot and ssgrasping"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ssmjviser==1.0.0",
    # Pinned by commit: the contracts and skills this app is proven against.
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@6445900f339f4d5a82566e3647c1b42396dbe1a2",
    "ssgrasping @ git+https://github.com/personalrobotics/ssgrasping@9d436dfc3180c6070ff07e6d382e8c642a37c8be",
    # Measurement only: sstsr#194 and prl_assets#24's floor, not for merge.
    "sstsr @ git+https://github.com/personalrobotics/sstsr@10f776aac0128395b3ff114f4a2d76fa3d9e65bc",
    "prl-assets @ git+https://github.com/personalrobotics/prl_assets@2c088b9fa2a6fd5a9b692507bc3e6b74bffdf4dd",
    # ssrobot's reference pin for Geodude (references/robots.toml): the 2F-140 driven like
    # the real gripper (geodude_assets#38), with its declared completion detector (#40).
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@e8f4b720687d7fcfa8a26c9dc9d7734f5f82b59e",
]

[project.scripts]
geodude-recycling = "geodude.recycling:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/geodude"]

# Its own workspace root: uv never adopts it into the robot-code workspace around the
# legacy app.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "prl_assets.*", "geodude_assets.*", "mj_viser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
