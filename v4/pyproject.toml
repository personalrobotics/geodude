# Geodude 4.0: Geodude on ssrobot and ssgrasping (personalrobotics/geodude#213).
#
# It is built alongside the legacy 3.x app at the repository root, as its own uv project
# with its own environment, and replaces it at the cutover (#212). It never imports
# mj_manipulator, mj_environment, asset_manager, or the old mj-viser
# (scripts/check_boundary.py).
[project]
name = "geodude"
version = "4.0.0.dev0"
description = "Geodude, the bimanual robot, on ssrobot and ssgrasping"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ssmjviser==1.0.0",
    # Imported directly (regions.py): the Robotiq hands' closed reach and a box's scaled
    # default margin (sstsr#193, #195), and StablePlacer.place, which places an object by
    # its collision geometry (sstsr#201); ssgrasping's sstsr adapter takes 4.2 or later.
    "sstsr==4.3.0",
    # Pinned by commit: the contracts and skills this app is proven against.
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@1d3cb77bdd7211304a8e2d898228ba5215e3ce6d",
    # With its sstsr adapter (ssgrasping.sstsr), whose requirements the resolver enforces.
    "ssgrasping[sstsr] @ git+https://github.com/personalrobotics/ssgrasping@fff4ba6a49524d6e4287403818cb5097e79b85e4",
    # With its placement extra: collision_shape, an object's collision geometry for
    # StablePlacer.place (prl_assets#50), each container's measured opening (#49), and the
    # grasp regions measured by recipe (#52).
    "prl-assets[placement] @ git+https://github.com/personalrobotics/prl_assets@746f831c0b877bec9e6c205f78f464da37f40ee3",
    # The 2F-140 driven like the real gripper (geodude_assets#38), with its declared
    # completion detector (#40), and each pad's torsional friction its contact face's
    # (#41), and its MuJoCo rest criteria (#46): ssrobot's reference pin for Geodude,
    # at the ssrobot pinned above.
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@f130a8f435ef7780fbc28014805c25cce6acd67b",
]

[project.scripts]
geodude-recycling = "geodude.recycling:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/geodude"]

# Its own workspace root: uv never adopts it into the robot-code workspace around the
# legacy app.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "prl_assets.*", "geodude_assets.*", "mj_viser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
