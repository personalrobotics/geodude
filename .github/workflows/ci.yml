name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job reads the repository and nothing more: the dispatch to robot-code uses its own
# token, not GITHUB_TOKEN. Actions are pinned by commit; Dependabot proposes updates
# (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  # Geodude 4.0 on ssrobot, from its own lock.
  test:
    runs-on: ubuntu-latest
    env:
      # Outcomes are claimed on one OpenBLAS kernel (geodude.recycling.REFERENCE_BLAS_KERNEL).
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: The reference OpenBLAS kernel
        run: |
          uv run python -c "from geodude.recycling import REFERENCE_BLAS_KERNEL as want, blas_kernel
          assert blas_kernel() == want, f'numpy runs on {blas_kernel()}, not {want}'"

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -v
        env:
          GEODUDE_ARTIFACTS: ${{ github.workspace }}/artifacts

      # Prove the wheel stands alone, outside the checkout.
      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel in a clean environment
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/clean" --python 3.13
          uv pip install --python "$RUNNER_TEMP/clean" -r "$RUNNER_TEMP/requirements.txt" dist/geodude-*.whl

      - name: Check the installed wheel and run its command
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/clean/bin/python"
          "$PY" -I "$GITHUB_WORKSPACE/scripts/check_boundary.py"
          "$RUNNER_TEMP/clean/bin/geodude-recycling" --seed 0 --record installed-run
          "$PY" -I "$GITHUB_WORKSPACE/scripts/check_installed.py" "$GITHUB_WORKSPACE" installed-run/recycling.json
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -r installed-run "$GITHUB_WORKSPACE/artifacts/installed-run"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: geodude-evidence
          path: artifacts/

  notify-robot-code:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch integration run
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0  # v3.0.0
        with:
          token: ${{ secrets.ROBOT_CODE_DISPATCH_TOKEN }}
          repository: personalrobotics/robot-code
          event-type: sibling-updated
          client-payload: '{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}'
