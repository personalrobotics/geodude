# Geodude 4.0: Geodude on ssrobot and ssgrasping (personalrobotics/geodude#213).
#
# It is built alongside the legacy 3.x app at the repository root, as its own uv project
# with its own environment, and replaces it at the cutover (#212). It never imports
# mj_manipulator, mj_environment, asset_manager, or the old mj-viser
# (scripts/check_boundary.py).
[project]
name = "geodude"
version = "4.0.0.dev0"
description = "Geodude, the bimanual robot, on ssrobot and ssgrasping"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ssmjviser==1.0.0",
    # Pinned by commit: the contracts and skills this app is proven against.
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@79b128a85a8c87023eeb2a27948d1fe098d98f00",
    "ssgrasping @ git+https://github.com/personalrobotics/ssgrasping@2775d6d04862d2c0f9b396830c9e89397108a900",
    "prl-assets @ git+https://github.com/personalrobotics/prl_assets@b632aafcf916c560e0ca928e7e3ff098ce51f465",
    # Ahead of ssrobot's reference pin for Geodude (references/robots.toml, 7b740c3): the
    # 2F-140 driven like the real gripper (geodude_assets#38).
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@c2f70876901a164ee95e63efd79f3a0a66c592e1",
]

[project.scripts]
geodude-recycling = "geodude.recycling:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/geodude"]

# Its own workspace root: uv never adopts it into the robot-code workspace around the
# legacy app.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "prl_assets.*", "geodude_assets.*", "mj_viser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
